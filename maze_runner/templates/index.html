<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Maze Runner</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <main>
    <h1>Maze Runner</h1>
    <p class="intro">Get the teal square to the red one. Use the arrow keys or WASD.</p>

    <div class="bar">
      <label>Size
        <select id="size">
          <option value="10">Small</option>
          <option value="15" selected>Medium</option>
          <option value="25">Large</option>
        </select>
      </label>
      <button id="new">New maze</button>
      <button id="hint">Show path</button>
      <button id="restart">Restart</button>
    </div>

    <canvas id="maze" aria-label="Maze"></canvas>

    <div class="stats">
      <span>Moves <b id="moves">0</b></span>
      <span>Time <b id="time">0.0s</b></span>
      <span>Seed <b id="seed"></b></span>
    </div>
    <p id="message" role="status"></p>

    <div class="pad" aria-label="Move buttons">
      <button data-d="up">Up</button>
      <button data-d="left">Left</button>
      <button data-d="down">Down</button>
      <button data-d="right">Right</button>
    </div>
  </main>
  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
